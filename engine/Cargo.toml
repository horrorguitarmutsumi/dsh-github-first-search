[package]
name = "github-first"
version = "0.1.0"
edition = "2024"
description = "GitHub-first research engine behind the dsh-github-first plugin: GitHub repository search + README fetch, JSON on stdout."
license = "MIT"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
